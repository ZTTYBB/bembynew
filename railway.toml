# Railway config as code.
#
# The schema accepts only three top-level tables -- [build], [deploy] and
# [environments]. Anything else (a [[services]] array, for instance) is not part
# of it and is silently ignored, so it belongs in the dashboard instead.
#
# Values below are the exact enum spellings from Railway's schema
# (https://railway.com/railway.schema.json): the builder and the restart policy
# are both upper case.
#
# Note that Railway has deprecated this file in favour of Infrastructure as Code
# and keeps it working only until 2026-12-01. Everything here can equally be set
# from the service's Settings tab, which is the safer place for it.

[build]
builder = "DOCKERFILE"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# The app answers this once it is serving; without it Railway treats a container
# that is still starting as healthy.
healthcheckPath = "/api/health"
healthcheckTimeout = 120
